}

message ListAuthSessionsRequest {
  int32 limit = 1;
  string status = 2;
}
message ListAuthSessionsResponse {
  repeated AuthSession sessions = 1;
}
message RevokeAuthSessionRequest {
  string id = 1;
  string reason = 2;
}
message RevokeAuthSessionResponse {
  AuthSession session = 1;
}

message ListAuthTokensRequest {
  int32 limit = 1;
  string status = 2;
}
message ListAuthTokensResponse {
  repeated AuthToken tokens = 1;
}
message RevokeAuthTokenRequest {
  string id = 1;
  string reason = 2;
}
message RevokeAuthTokenResponse {
  AuthToken token = 1;
}

message ListAuthAuthorizationsRequest {
  string status = 1;
}
message ListAuthAuthorizationsResponse {
  repeated AuthAuthorization authorizations = 1;
}
message GrantAuthAuthorizationRequest {
  AuthAuthorization authorization = 1;
}
message GrantAuthAuthorizationResponse {
  AuthAuthorization authorization = 1;
}
message RevokeAuthAuthorizationRequest {
  string identity_id = 1;
  string reason = 2;
}
message RevokeAuthAuthorizationResponse {
  AuthAuthorization authorization = 1;
}

message ListAuthAuditRequest {
  int32 limit = 1;
  string type = 2;
  string identity_id = 3;
  string session_id = 4;
  string token_id = 5;
  string method = 6;
  google.protobuf.Timestamp since = 7;
}
message ListAuthAuditResponse {
  repeated AuthAuditEvent events = 1;
}
message PruneAuthRequest {
  google.protobuf.Timestamp before = 1;
  int32 limit = 2;
  bool dry_run = 3;
}
message PruneAuthResponse {
  int32 tokens = 1;
  int32 sessions = 2;
  int32 authorizations = 3;
  int32 audit_events = 4;
  bool dry_run = 5;
}

message RotateAuthIdentityRequest {
  string current_identity_id = 1;
  string next_identity_id = 2;
  bytes next_public_key = 3;
  uint64 next_generation = 4;
}
message RotateAuthIdentityResponse {
  AuthAuthorization authorization = 1;
}

message GetAuthIdentityStatusRequest {}
message GetAuthIdentityStatusResponse {
  string identity_id = 1;
  uint64 generation = 2;
  uint64 authorization_revision = 3;
  string status = 4;
}
