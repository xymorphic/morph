syntax = "proto3";

package morph.v1;

option go_package = "github.com/xymorphic/morph/internal/rpc/proto;morphpb";

import "google/protobuf/timestamp.proto";

service SessionService {
  rpc Create(CreateSessionRequest) returns (CreateSessionResponse);
  rpc List(ListSessionsRequest) returns (ListSessionsResponse);
  rpc Use(UseSessionRequest) returns (UseSessionResponse);
  rpc Archive(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc Unarchive(UnarchiveSessionRequest) returns (UnarchiveSessionResponse);
  rpc Rename(RenameSessionRequest) returns (RenameSessionResponse);
  rpc Current(CurrentSessionRequest) returns (CurrentSessionResponse);
  rpc Compact(CompactSessionRequest) returns (CompactSessionResponse);
  rpc Repair(RepairSessionRequest) returns (RepairSessionResponse);
  rpc Status(GetSessionStatusRequest) returns (GetSessionStatusResponse);
  rpc Timeline(GetSessionTimelineRequest) returns (GetSessionTimelineResponse);
  rpc EnqueueMessage(EnqueueSessionMessageRequest) returns (EnqueueSessionMessageResponse);
  rpc State(GetSessionStateRequest) returns (GetSessionStateResponse);
  rpc Observe(ObserveSessionRequest) returns (stream ObserveSessionResponse);
  rpc EditQueuedMessage(EditQueuedSessionMessageRequest) returns (EditQueuedSessionMessageResponse);
  rpc RemoveQueuedMessage(RemoveQueuedSessionMessageRequest) returns (RemoveQueuedSessionMessageResponse);
  rpc PromoteQueuedMessage(PromoteQueuedSessionMessageRequest) returns (PromoteQueuedSessionMessageResponse);
  rpc SteerQueuedMessage(SteerQueuedSessionMessageRequest) returns (SteerQueuedSessionMessageResponse);
  rpc InterruptRun(InterruptSessionRunRequest) returns (InterruptSessionRunResponse);
  rpc SetReasoningEffort(SetSessionReasoningEffortRequest) returns (SetSessionReasoningEffortResponse);
  rpc ListExecutionEnvironments(ListExecutionEnvironmentsRequest) returns (ListExecutionEnvironmentsResponse);
  rpc ExplainExecutionEnvironment(ExplainExecutionEnvironmentRequest) returns (ExplainExecutionEnvironmentResponse);
}

service ModelService {
  rpc RuntimeModel(RuntimeModelRequest) returns (RuntimeModelResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SelectModel(SelectModelRequest) returns (SelectModelResponse);
  rpc SetProviderAPIKey(SetProviderAPIKeyRequest) returns (SetProviderAPIKeyResponse);
}

service GatewayService {
  rpc Status(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
  rpc Start(StartGatewayRequest) returns (StartGatewayResponse);
  rpc Stop(StopGatewayRequest) returns (StopGatewayResponse);
  rpc Restart(RestartGatewayRequest) returns (RestartGatewayResponse);
  rpc ListPairings(ListGatewayPairingsRequest) returns (ListGatewayPairingsResponse);
  rpc ApprovePairing(ApproveGatewayPairingRequest) returns (ApproveGatewayPairingResponse);
  rpc RevokePairing(RevokeGatewayPairingRequest) returns (RevokeGatewayPairingResponse);
  rpc ClearPendingPairings(ClearPendingGatewayPairingsRequest) returns (ClearPendingGatewayPairingsResponse);
}

service AutomationService {
  rpc Status(GetAutomationStatusRequest) returns (GetAutomationStatusResponse);
  rpc ListJobs(ListAutomationJobsRequest) returns (ListAutomationJobsResponse);
  rpc AddJob(AddAutomationJobRequest) returns (AddAutomationJobResponse);
  rpc UpdateJob(UpdateAutomationJobRequest) returns (UpdateAutomationJobResponse);
  rpc RemoveJob(RemoveAutomationJobRequest) returns (RemoveAutomationJobResponse);
  rpc RunJob(RunAutomationJobRequest) returns (RunAutomationJobResponse);
  rpc ListRuns(ListAutomationRunsRequest) returns (ListAutomationRunsResponse);
}

service PermissionService {
  rpc ListRequests(ListPermissionRequestsRequest) returns (ListPermissionRequestsResponse);
  rpc GetRequest(GetPermissionRequestRequest) returns (GetPermissionRequestResponse);
  rpc ResolveRequest(ResolvePermissionRequestRequest) returns (ResolvePermissionRequestResponse);
  rpc ListGrants(ListPermissionGrantsRequest) returns (ListPermissionGrantsResponse);
  rpc GetGrant(GetPermissionGrantRequest) returns (GetPermissionGrantResponse);
  rpc RevokeGrant(RevokePermissionGrantRequest) returns (RevokePermissionGrantResponse);
  rpc DeleteRecord(DeletePermissionRecordRequest) returns (DeletePermissionRecordResponse);
  rpc Prune(PrunePermissionApprovalsRequest) returns (PrunePermissionApprovalsResponse);
}

service BrowserService {
  rpc Status(GetBrowserStatusRequest) returns (GetBrowserStatusResponse);
  rpc ListProfiles(ListBrowserProfilesRequest) returns (ListBrowserProfilesResponse);
  rpc ListSessions(ListBrowserSessionsRequest) returns (ListBrowserSessionsResponse);
  rpc Start(StartBrowserRequest) returns (StartBrowserResponse);
  rpc Stop(StopBrowserRequest) returns (StopBrowserResponse);
  rpc ReadArtifact(ReadBrowserArtifactRequest) returns (stream ReadBrowserArtifactResponse);
  rpc EffectiveConfig(GetBrowserEffectiveConfigRequest) returns (GetBrowserEffectiveConfigResponse);
}

service AuthService {
  rpc OpenSession(OpenAuthSessionRequest) returns (OpenAuthSessionResponse);
  rpc CloseSession(CloseAuthSessionRequest) returns (CloseAuthSessionResponse);
  rpc ListSessions(ListAuthSessionsRequest) returns (ListAuthSessionsResponse);
  rpc RevokeSession(RevokeAuthSessionRequest) returns (RevokeAuthSessionResponse);
  rpc ListTokens(ListAuthTokensRequest) returns (ListAuthTokensResponse);
  rpc RevokeToken(RevokeAuthTokenRequest) returns (RevokeAuthTokenResponse);
  rpc ListAuthorizations(ListAuthAuthorizationsRequest) returns (ListAuthAuthorizationsResponse);
  rpc GrantAuthorization(GrantAuthAuthorizationRequest) returns (GrantAuthAuthorizationResponse);
  rpc RevokeAuthorization(RevokeAuthAuthorizationRequest) returns (RevokeAuthAuthorizationResponse);
  rpc ListAudit(ListAuthAuditRequest) returns (ListAuthAuditResponse);
  rpc Prune(PruneAuthRequest) returns (PruneAuthResponse);
  rpc RotateIdentity(RotateAuthIdentityRequest) returns (RotateAuthIdentityResponse);
  rpc IdentityStatus(GetAuthIdentityStatusRequest) returns (GetAuthIdentityStatusResponse);
}

message SessionSummary {
  string id = 1;
  int64 updated_at_unix = 2;
  int32 message_count = 3;
  string title = 4;
  string title_source = 5;
  string origin_source = 6;
}

message CreateSessionRequest {
  string id = 1;
  optional bool auto_switch = 2;
  string origin_source = 3;
}

message CreateSessionResponse {
  SessionSummary session = 1;
}

message ListSessionsRequest {
  optional bool archived = 1;
  string origin_source = 2;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message UseSessionRequest {
  string id = 1;
}

message UseSessionResponse {
  string id = 1;
}

message ArchiveSessionRequest {
  string id = 1;
}

message ArchiveSessionResponse {
  string id = 1;
}

message ExecutionMount {
  string name = 1;
  string target = 2;
  string mode = 3;
  string purpose = 4;
}

message ExecutionLimits {
  int64 memory_bytes = 1;
  int64 cpu_milli = 2;
  int64 pids = 3;
  int64 open_files = 4;
  int64 temporary_bytes = 5;
  int64 output_bytes = 6;
  int64 runtime_millis = 7;
}

message ExecutionEnvironment {
  string id = 1;
  string backend = 2;
  string scope = 3;
  string state = 4;
  string workspace_mode = 5;
  string network = 6;
  string image_digest = 7;
  string security_generation = 8;
  string daemon_incarnation = 9;
  string container_incarnation = 10;
  int32 participant_count = 11;
  int32 process_count = 12;
  string failure_code = 13;
  repeated ExecutionMount mounts = 14;
  repeated string secret_references = 15;
  ExecutionLimits limits = 16;
  string policy_hash = 17;
  string image_contract_digest = 18;
}

message ListExecutionEnvironmentsRequest {
  string session_id = 1;
}

message ListExecutionEnvironmentsResponse {
  repeated ExecutionEnvironment environments = 1;
}

message ExplainExecutionEnvironmentRequest {
  string session_id = 1;
  string environment_id = 2;
}

message ExplainExecutionEnvironmentResponse {
  ExecutionEnvironment environment = 1;
}

message UnarchiveSessionRequest {
  string id = 1;
}

message UnarchiveSessionResponse {
  SessionSummary session = 1;
}

message RenameSessionRequest {
  string id = 1;
  string title = 2;
}

message RenameSessionResponse {
  SessionSummary session = 1;
}

message CurrentSessionRequest {}

message CurrentSessionResponse {
  string id = 1;
  string title = 2;
  string title_source = 3;
}

message CompactSessionRequest {
  string id = 1;
}

message CompactSessionResponse {
  string id = 1;
  int32 source_end_offset = 2;
  int32 source_message_count = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 current_context_length = 5;
  int32 total_context_length = 6;
}

message RepairSessionRequest {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    VECTOR = 1;
  }

  Type type = 1;
  VectorRepairOption vector = 2;
}

message RepairSessionResponse {
  RepairSessionRequest.Type type = 1;
  VectorRepairResponse vector = 2;
}

message VectorRepairOption {
  string id = 1;
  bool full = 2;
}

message VectorRepairResponse {
  int32 sessions_scanned = 1;
  int32 messages_scanned = 2;
  int32 rows_scanned = 3;
  int32 missing_rows = 4;
  int32 stale_rows = 5;
  int32 unchanged_rows = 6;
  int32 rebuilt_rows = 7;
  int32 deleted_sources = 8;
  int32 batches = 9;
  int32 attempted_sources = 10;
  int32 recovered_sources = 11;
  int32 still_failed_sources = 12;
}

message GetSessionStatusRequestContext {
  string id = 1;
}

message GetSessionStatusRequest {
  GetSessionStatusRequestContext context = 1;
}

message GetSessionStatusResponse {
  string id = 1;
  Context context = 2;
  int32 size = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string compaction_status = 6;

  message Context {
    int32 offset = 1;
    int32 length = 2;
    int32 used = 3;
    int32 remaining = 4;
    double used_pct = 5;
    double remaining_pct = 6;
    string usage_source = 7;
  }
}

message GetSessionTimelineRequest {
  string id = 1;
  int32 message_offset = 2;
  int32 message_limit = 3;
  int32 trace_offset = 4;
  int32 trace_limit = 5;
}

message SessionTimelineToolCall {
  string id = 1;
  string name = 2;
  string input = 3;
}

message SessionTimelineMessage {
  int32 offset = 1;
  uint64 id = 2;
  string role = 3;
  string name = 4;
  string tool_call_id = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated SessionTimelineToolCall tool_calls = 8;
}

message SessionTimelineTraceEvent {
  uint64 id = 1;
  int32 sequence = 2;
  string type = 3;
  google.protobuf.Timestamp timestamp = 4;
  string payload_json = 5;
}

message GetSessionTimelineResponse {
  string id = 1;
  repeated SessionTimelineMessage messages = 2;
  repeated SessionTimelineTraceEvent trace_events = 3;
  bool messages_has_more = 4;
  bool traces_has_more = 5;
  bool traces_truncated_before = 6;
  int32 first_trace_sequence = 7;
  int32 last_trace_sequence = 8;
  string title = 9;
  string title_source = 10;
}

message SessionQueueEntry {
  string id = 1;
  string session_id = 2;
  string content = 3;
  string client_submission_id = 4;
  string target_run_id = 5;
  string delivery_mode = 6;
  string steering_fallback = 7;
  string status = 8;
  string actor_kind = 9;
  string actor_id = 10;
  string surface_kind = 11;
  string surface = 12;
  string profile = 13;
  int64 sequence = 14;
  int64 priority = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp completed_at = 19;
  string last_error = 20;
  string requested_delivery_mode = 21;
  string instruct = 22;
  optional bool stream = 23;
}

message SessionActiveRun {
  string id = 1;
  string session_id = 2;
  string queue_entry_id = 3;
  string generation = 4;
  string status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string reason = 9;
  string last_error = 10;
  ReasoningRunSnapshot reasoning = 11;
}

message SessionEvent {
  string session_id = 1;
  string type = 2;
  int64 cursor = 3;
  google.protobuf.Timestamp created_at = 4;
  SessionQueueEntry queue_entry = 5;
  SessionActiveRun run = 6;
  string progress_kind = 7;
  string progress_channel = 8;
  string progress_text = 9;
  string progress_run_id = 10;
  string progress_queue_entry_id = 11;
  int64 progress_sequence = 12;
  SessionTimelineTraceEvent progress_trace_event = 13;
}

message SessionProgressEvent {
  string kind = 1;
  string channel = 2;
  string text = 3;
  string run_id = 4;
  string queue_entry_id = 5;
  int64 sequence = 6;
  SessionTimelineTraceEvent trace_event = 7;
}

message EnqueueSessionMessageRequest {
  string id = 1;
  string message = 2;
  string client_submission_id = 3;
  string delivery_mode = 4;
  string steering_fallback = 5;
  string instruct = 6;
  optional bool stream = 7;
}

message EnqueueSessionMessageResponse {
  SessionQueueEntry entry = 1;
}

message GetSessionStateRequest {
  string id = 1;
}

message GetSessionStateResponse {
  string id = 1;
  SessionActiveRun active_run = 2;
  repeated SessionQueueEntry queue = 3;
  int64 cursor = 4;
  int64 retained_cursor_floor = 5;
  int32 queue_depth = 6;
  google.protobuf.Timestamp oldest_pending_created_at = 7;
  repeated SessionProgressEvent progress = 8;
  SessionReasoningSettings reasoning = 9;
}

message ReasoningModelTuple {
  string provider = 1;
  string api = 2;
  string model = 3;
  string display_name = 4;
}

message ReasoningRunSnapshot {
  string provider = 1;
  string api = 2;
  string model = 3;
  string effort = 4;
  bool summary = 5;
}

message SessionReasoningSettings {
  ReasoningModelTuple model = 1;
  bool reasoning = 2;
  bool adjustable = 3;
  repeated string supported_efforts = 4;
  string session_override = 5;
  string profile_default = 6;
  string catalog_default = 7;
  string effective_effort = 8;
  string dormant_effort = 9;
  string source = 10;
  string fallback = 11;
  bool summary_supported = 12;
  ReasoningRunSnapshot active_run = 13;
}

message SetSessionReasoningEffortRequest {
  string id = 1;
  string expected_provider = 2;
  string expected_api = 3;
  string expected_model = 4;
  string effort = 5;
  bool reset = 6;
}

message SetSessionReasoningEffortResponse {
  SessionReasoningSettings reasoning = 1;
}

message ObserveSessionRequest {
  string id = 1;
  int64 after_cursor = 2;
}

message ObserveSessionResponse {
  SessionEvent event = 1;
}

message EditQueuedSessionMessageRequest {
  string id = 1;
  string entry_id = 2;
  string message = 3;
}

message EditQueuedSessionMessageResponse {
  SessionQueueEntry entry = 1;
}

message RemoveQueuedSessionMessageRequest {
  string id = 1;
  string entry_id = 2;
}

message RemoveQueuedSessionMessageResponse {
  SessionQueueEntry entry = 1;
}

message PromoteQueuedSessionMessageRequest {
  string id = 1;
  string entry_id = 2;
}

message PromoteQueuedSessionMessageResponse {
  SessionQueueEntry entry = 1;
}

message SteerQueuedSessionMessageRequest {
  string id = 1;
  string entry_id = 2;
}

message SteerQueuedSessionMessageResponse {
  SessionQueueEntry entry = 1;
}

message InterruptSessionRunRequest {
  string id = 1;
}

message InterruptSessionRunResponse {
  SessionActiveRun run = 1;
  bool transitioned = 2;
}

message RuntimeModelRequest {}

message RuntimeModelResponse {
  string provider = 1;
  string api = 2;
  string model = 3;
  string base_url = 4;
  int32 context_length = 5;
}

message ListProvidersRequest {}

message ProviderOption {
  string id = 1;
  string name = 2;
  string type = 3;
  int32 model_count = 4;
  bool supports_api_key = 5;
  bool supports_oauth = 6;
  string auth_type = 7;
  bool current = 8;
}

message ListProvidersResponse {
  repeated ProviderOption providers = 1;
}

message ListModelsRequest {
  string provider = 1;
}

message ModelOption {
  string id = 1;
  string name = 2;
  string provider = 3;
  string api = 4;
  int32 context_window = 5;
  int32 max_tokens = 6;
  repeated string input = 7;
  bool reasoning = 8;
  bool supports_oauth = 9;
  bool current = 10;
}

message ListModelsResponse {
  string provider = 1;
  string auth_type = 2;
  repeated ModelOption models = 3;
}

message SelectModelRequest {
  string id = 1;
  string provider = 2;
  string api = 3;
}

message SelectModelResponse {
  ModelOption model = 1;
}

message SetProviderAPIKeyRequest {
  string provider = 1;
  string api_key = 2;
}

message SetProviderAPIKeyResponse {
  string provider = 1;
}

message GatewayStatus {
  string state = 1;
  string address = 2;
  int32 port = 3;
  string slack_mode = 4;
  string telegram_mode = 5;
  string last_error = 6;
}

message GetGatewayStatusRequest {}

message GetGatewayStatusResponse {
  GatewayStatus status = 1;
}

message StartGatewayRequest {}

message StartGatewayResponse {
  GatewayStatus status = 1;
}

message StopGatewayRequest {}

message StopGatewayResponse {
  GatewayStatus status = 1;
}

message RestartGatewayRequest {}

message RestartGatewayResponse {
  GatewayStatus status = 1;
}

message GatewayPairingRequest {
  string source = 1;
  string sender_id = 2;
  string display_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message GatewayPairedSender {
  string source = 1;
  string sender_id = 2;
  string display_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListGatewayPairingsRequest {
  string source = 1;
}

message ListGatewayPairingsResponse {
  repeated GatewayPairingRequest pending = 1;
  repeated GatewayPairedSender approved = 2;
}

message ApproveGatewayPairingRequest {
  string source = 1;
  string code = 2;
}

message ApproveGatewayPairingResponse {
  bool approved = 1;
  GatewayPairedSender sender = 2;
}

message RevokeGatewayPairingRequest {
  string source = 1;
  string sender_id = 2;
}

message RevokeGatewayPairingResponse {}

message ClearPendingGatewayPairingsRequest {
  string source = 1;
}

message ClearPendingGatewayPairingsResponse {}

message AutomationSchedule {
  string kind = 1;
  google.protobuf.Timestamp at = 2;
  int64 every_nanos = 3;
  string cron = 4;
  string timezone = 5;
}

message AutomationPayload {
  string kind = 1;
  string prompt = 2;
  string system_event = 3;
  string model = 4;
  string provider = 5;
  string base_url = 6;
  bool no_timeout = 7;
  int64 max_runtime_nanos = 8;
  int32 max_iterations = 9;
  int32 retry_attempts = 10;
  int64 retry_backoff_nanos = 11;
  int64 retry_max_delay_nanos = 12;
  repeated string tool_groups = 13;
  map<string, string> metadata = 14;
}

message AutomationDelivery {
  string mode = 1;
  string channel = 2;
  string target = 3;
  string thread_id = 4;
  string webhook_url = 5;
  bool best_effort = 6;
  string failure_target = 7;
  int32 failure_after = 8;
  int64 failure_cooldown_nanos = 9;
}

message AutomationJobState {
  google.protobuf.Timestamp next_run_at = 1;
  google.protobuf.Timestamp running_at = 2;
  google.protobuf.Timestamp last_run_at = 3;
  string last_status = 4;
  string last_error = 5;
  int64 last_duration_nanos = 6;
  int32 consecutive_errors = 7;
  google.protobuf.Timestamp last_failure_notice_at = 8;
}

message AutomationJob {
  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  AutomationSchedule schedule = 7;
  AutomationPayload payload = 8;
  AutomationDelivery delivery = 9;
  string profile = 10;
  string session_target = 11;
  bool delete_after_run = 12;
  AutomationJobState state = 13;
}

message AutomationUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 total_tokens = 3;
  int32 cache_read_tokens = 4;
  int32 cache_write_tokens = 5;
}

message AutomationRun {
  string id = 1;
  string job_id = 2;
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  int64 duration_nanos = 6;
  string output = 7;
  string error = 8;
  string session_id = 9;
  string delivery_status = 10;
  string delivery_error = 11;
  string model = 12;
  string provider = 13;
  AutomationUsage usage = 14;
}

message GetAutomationStatusRequest {}

message GetAutomationStatusResponse {
  bool running = 1;
  google.protobuf.Timestamp started_at = 2;
  int32 job_count = 3;
  int32 running_count = 4;
  google.protobuf.Timestamp next_wake_at = 5;
}

message ListAutomationJobsRequest {
  repeated string ids = 1;
  optional bool enabled = 2;
  string profile = 3;
  string session_target = 4;
  int32 limit = 5;
  bool include_disabled = 6;
}

message ListAutomationJobsResponse {
  repeated AutomationJob jobs = 1;
}

message AddAutomationJobRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  AutomationSchedule schedule = 7;
  AutomationPayload payload = 8;
  AutomationDelivery delivery = 9;
  string profile = 10;
  string session_target = 11;
  bool delete_after_run = 12;
  AutomationJobState state = 13;
}

message AddAutomationJobResponse {
  AutomationJob job = 1;
}

message UpdateAutomationJobRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional bool enabled = 4;
  AutomationSchedule schedule = 5;
  AutomationPayload payload = 6;
  AutomationDelivery delivery = 7;
  optional string profile = 8;
  optional string session_target = 9;
  optional bool delete_after_run = 10;
  AutomationJobState state = 11;
}

message UpdateAutomationJobResponse {
  AutomationJob job = 1;
}

message RemoveAutomationJobRequest {
  string id = 1;
}

message RemoveAutomationJobResponse {
  string id = 1;
}

message RunAutomationJobRequest {
  string id = 1;
}

message RunAutomationJobResponse {
  AutomationRun run = 1;
}

message ListAutomationRunsRequest {
  string job_id = 1;
  repeated string ids = 2;
  repeated string status = 3;
  int32 limit = 4;
}

message ListAutomationRunsResponse {
  repeated AutomationRun runs = 1;
}

message PermissionApprovalRequest {
  string id = 1;
  string actor_kind = 2;
  string surface_kind = 3;
  string surface = 4;
  string profile = 5;
  string session_id = 6;
  string tool = 7;
  string resource = 8;
  string action = 9;
  repeated string effects = 10;
  string summary = 11;
  string reason = 12;
  string status = 13;
  string scope = 14;
  string grant_id = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp expires_at = 17;
  google.protobuf.Timestamp resolved_at = 18;
  repeated string operations = 19;
}

message PermissionGrant {
  string id = 1;
  string request_id = 2;
  string actor_kind = 3;
  string profile = 4;
  string session_id = 5;
  string scope = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp consumed_at = 10;
  google.protobuf.Timestamp revoked_at = 11;
  repeated string operations = 12;
  string actor_id = 13;
  string fingerprint = 14;
}

message ListPermissionRequestsRequest {
  string status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPermissionRequestsResponse {
  repeated PermissionApprovalRequest requests = 1;
}

message GetPermissionRequestRequest { string id = 1; }
message GetPermissionRequestResponse { PermissionApprovalRequest request = 1; }

message ResolvePermissionRequestRequest {
  string id = 1;
  bool approved = 2;
  string scope = 3;
}

message ResolvePermissionRequestResponse { PermissionApprovalRequest request = 1; }

message ListPermissionGrantsRequest {
  string status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPermissionGrantsResponse { repeated PermissionGrant grants = 1; }
message RevokePermissionGrantRequest { string id = 1; }
message RevokePermissionGrantResponse { PermissionGrant grant = 1; }

message DeletePermissionRecordRequest { string id = 1; }
message DeletePermissionRecordResponse {
  string id = 1;
  string kind = 2;
  string linked_grant_id = 3;
}

message PrunePermissionApprovalsRequest { bool dry_run = 1; }
message PrunePermissionApprovalsResponse {
  int64 requests = 1;
  int64 grants = 2;
  google.protobuf.Timestamp request_cutoff = 3;
  google.protobuf.Timestamp grant_cutoff = 4;
  bool dry_run = 5;
}

message BrowserProfile {
  string name = 1;
  string mode = 2;
  bool default = 3;
  bool available = 4;
  string warning = 5;
}

message BrowserSession {
  string id = 1;
  string profile = 2;
  string profile_mode = 3;
  string state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_active = 6;
  string error = 7;
  string warning = 8;
}

message BrowserArtifact {
  string handle = 1;
  string kind = 2;
  string name = 3;
