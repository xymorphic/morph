  string owner_id = 3;
  string user_id = 4;
  repeated string roles = 5;
  string source = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_seen_at = 9;
  google.protobuf.Timestamp idle_expires_at = 10;
  google.protobuf.Timestamp absolute_expires_at = 11;
  uint64 identity_generation = 12;
  uint64 authorization_revision = 13;
  google.protobuf.Timestamp revoked_at = 14;
  string revocation_note = 15;
}

message AuthToken {
  string id = 1;
  string session_id = 2;
  string identity_id = 3;
  string owner_id = 4;
  string user_id = 5;
  repeated string roles = 6;
  repeated string services = 7;
  repeated string methods = 8;
  google.protobuf.Timestamp issued_at = 9;
  google.protobuf.Timestamp not_before = 10;
  google.protobuf.Timestamp expires_at = 11;
  google.protobuf.Timestamp last_used_at = 12;
  uint64 use_count = 13;
  string status = 14;
  uint64 identity_generation = 15;
  uint64 authorization_revision = 16;
  string certificate_thumbprint = 17;
  google.protobuf.Timestamp revoked_at = 18;
  string revocation_note = 19;
}

message AuthAuthorization {
  string identity_id = 1;
  bytes public_key = 2;
  string owner_id = 3;
  string user_id = 4;
  repeated string roles = 5;
  repeated string services = 6;
  repeated string methods = 7;
  int64 maximum_ttl_seconds = 8;
  uint64 generation = 9;
  uint64 revision = 10;
  string status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp revoked_at = 14;
  string revocation_note = 15;
}

message AuthAuditEvent {
  string id = 1;
  string type = 2;
  string identity_id = 3;
  string session_id = 4;
  string token_id = 5;
  string method = 6;
  string reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

message OpenAuthSessionRequest {
  string source = 1;
}
message OpenAuthSessionResponse {
  AuthPrincipal principal = 1;
  AuthSession session = 2;
}

message CloseAuthSessionRequest {}
message CloseAuthSessionResponse {
