name: Sandbox image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/xymorphic/morph-sandbox:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/xymorphic/morph-sandbox@${DIGEST}"
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          CONTRACT_DIGEST="sha256:$(sha256sum containers/sandbox/contract.json | cut -d ' ' -f 1)"
          jq \
            --arg digest "${DIGEST}" \
            --arg release "${GITHUB_REF_NAME}" \
            --arg contract_digest "${CONTRACT_DIGEST}" \
            '.digest=$digest | .release=$release | .contract_digest=$contract_digest' \
            containers/sandbox/manifest.json > sandbox-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: sandbox-manifest
          path: sandbox-manifest.json
