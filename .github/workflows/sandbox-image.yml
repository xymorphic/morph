name: Sandbox image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/xymorphic/morph-sandbox:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/xymorphic/morph-sandbox@${DIGEST}"
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq --arg digest "${DIGEST}" --arg release "${GITHUB_REF_NAME}" '.digest=$digest | .release=$release' containers/sandbox/manifest.json > sandbox-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-manifest
          path: sandbox-manifest.json
