name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  general:
    name: General
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install Protocol Buffers Go tools
        run: make install-proto-tools
      - name: Run tests
        run: make test

  e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install Protocol Buffers Go tools
        run: make install-proto-tools
      - name: Build sandbox image
        run: make build-sandbox
      - name: Run Docker E2E tests
        run: make test-execution-docker
